load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    js_import /etc/nginx/njs/passage_generator.js;

    upstream ollama_backend {
        server ollama:11434;
    }

    upstream app_backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost api.whitebored.local;

        # Route passage generation requests through Nginx-JS
        location /api/generate-passage {
            js_content passage_generator.handlePassageRequest;
        }

        # Proxy standard Ollama fallback API endpoints if needed
        location /ollama/ {
            proxy_pass http://ollama_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Main application proxy
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}