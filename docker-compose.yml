services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-server
    container_name: whitebored-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: always

  app:
    build:
      context: .
      target: app-server       # <-- THIS IS THE FIX
    container_name: whitebored-app-1
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/whitebored
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=supersecretpassword
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: whitebored-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  mongo:
    image: mongo:latest
    container_name: whitebored-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

volumes:
  mongo_data:
  ollama_data: